# Läuft neben authentik: im selben Docker-Netzwerk (siehe "networks") ist authentik per Servicename erreichbar,
# für OIDC_ISSUER wird aber die öffentliche URL genutzt (muss mit dem Issuer von authentik übereinstimmen).
services:
  quotes:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"            # hinter Reverse-Proxy (Traefik/Caddy/nginx)
    ports:
      - "127.0.0.1:3000:3000"     # nur lokal; den Reverse-Proxy davorschalten
    volumes:
      - quotes-data:/data
    read_only: true
    tmpfs: [/tmp]                 # Bildverarbeitung braucht ggf. temporären Platz
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional: lokale KI für „Zitat aus Foto erkennen“ (danach: docker compose exec ollama ollama pull qwen2.5vl:7b)
  # und in .env: OLLAMA_URL=http://ollama:11434 – Ollama ist dann nur im internen Docker-Netz erreichbar.
  # ollama:
  #   image: ollama/ollama   # Version festpinnen
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   # GPU (NVIDIA): deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

volumes:
  quotes-data:
  # ollama-models:

# Optional: gemeinsames Netzwerk mit authentik / Reverse-Proxy
